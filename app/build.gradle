plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mastagohim.bukukenangan'
    compileSdk 33

    defaultConfig {
        applicationId "com.mastagohim.bukukenangan"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "VERSION_NAME", '"1.0"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (file('../buku-kenangan-release.keystore').exists()) {
            release {
                storeFile file('../buku-kenangan-release.keystore')
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: 'buku123'
                keyAlias 'buku-kenangan'
                keyPassword System.getenv("KEY_PASSWORD") ?: 'buku123'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false  // TEMP: disable for crash test
            shrinkResources false  // TEMP: disable for crash test
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.find { it.name == 'release' } ?: signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.cardview:cardview:1.0.0'
}