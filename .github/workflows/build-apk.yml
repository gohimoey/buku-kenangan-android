name: Build Buku Kenangan APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Install Android SDK
      run: |
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O /tmp/cmdline.zip
        mkdir -p $HOME/Android/Sdk/cmdline-tools
        unzip -q /tmp/cmdline.zip -d $HOME/Android/Sdk/cmdline-tools
        rm /tmp/cmdline.zip
        mkdir -p $HOME/Android/Sdk/cmdline-tools/latest
        cp -r $HOME/Android/Sdk/cmdline-tools/cmdline-tools/* $HOME/Android/Sdk/cmdline-tools/latest/
        yes | $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/Android/Sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3"
        echo "ANDROID_HOME=$HOME/Android/Sdk" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $GITHUB_ENV

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > app/local.properties

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon -x lint --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-debug
        path: app/build/outputs/apk/debug/app-debug.apk
