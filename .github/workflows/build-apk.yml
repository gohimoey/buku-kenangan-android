name: Build Buku Kenangan APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04  # Has better compatibility for old SDKs
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: '8'
        cache: 'gradle'

    - name: Setup Android
      uses: malinskiy/action-android@master
      with:
        api-level: 16
        build-tools: 28.0.3

    - name: Build APK
      run: |
        ls -la $ANDROID_HOME
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "Platform: $ANDROID_HOME/platforms/android-16"
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apks
        path: app/build/outputs/apk/**/*.apk